<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liver Disease Prediction System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    
    <div class="hero-banner text-center">
        <div class="container">
            <h1><i class="fas fa-user-md me-2"></i> Liver Disease Diagnostic Portal</h1>
            <p>AI-Powered Clinical Decision Support System for Early Liver Health Assessment</p>
        </div>
    </div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-4 p-md-5">
                        {% if prediction_text %}
                        <div class="alert alert-{{ status_class }} text-center p-3 mb-4 rounded-3 shadow-sm">
                            <h4 class="alert-heading fw-bold mb-1">{{ prediction_text }}</h4>
                            <p class="mb-0 fs-6">{{ description }}</p>
                        </div>
                        {% endif %}

                        <form action="/predict" method="POST">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Patient Age</label>
                                    <input type="number" step="any" name="age" class="form-control" placeholder="e.g. 45" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Gender</label>
                                    <select name="gender" class="form-select" required>
                                        <option value="" selected disabled>Select Gender</option>
                                        <option value="1">Male</option>
                                        <option value="0">Female</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Total Bilirubin</label>
                                    <input type="number" step="any" name="total_bilirubin" class="form-control" placeholder="mg/dL" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Direct Bilirubin</label>
                                    <input type="number" step="any" name="direct_bilirubin" class="form-control" placeholder="mg/dL" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Alkaline Phosphatase (Alkphos)</label>
                                    <input type="number" step="any" name="alkphos" class="form-control" placeholder="IU/L" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Alamine Aminotransferase (SGPT)</label>
                                    <input type="number" step="any" name="sgpt" class="form-control" placeholder="IU/L" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Aspartate Aminotransferase (SGOT)</label>
                                    <input type="number" step="any" name="sgot" class="form-control" placeholder="IU/L" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Total Proteins</label>
                                    <input type="number" step="any" name="total_proteins" class="form-control" placeholder="g/dL" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Albumin (ALB)</label>
                                    <input type="number" step="any" name="alb" class="form-control" placeholder="g/dL" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">A/G Ratio</label>
                                    <input type="number" step="any" name="ag_ratio" class="form-control" placeholder="Albumin/Globulin Ratio" required>
                                </div>
                            </div>

                            <div class="mt-4 text-center">
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 shadow">Predict Result</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
